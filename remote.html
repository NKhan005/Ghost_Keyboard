<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-BOARD | GYRO CONTROLLER</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@600&display=swap');
        
        * { 
            box-sizing: border-box; 
            touch-action: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background: #020b14;
            color: #00f2ff;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            overflow: hidden;
        }

        .header { text-align: center; margin-top: 10px; }
        .header h1 { font-size: 1.3rem; letter-spacing: 3px; }
        .status { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #ffb700; margin-top: 8px; }

        #connect_box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid #00f2ff;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
        }

        button {
            background: #00f2ff;
            color: #000000;
            border: none;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            cursor: pointer;
        }

        #trackpad {
            display: none;
            width: 100%;
            height: 65vh;
            border: 2px dashed rgba(0, 242, 255, 0.4);
            border-radius: 12px;
            background: rgba(0, 242, 255, 0.03);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
        }

        #trackpad.active { display: flex; }

        .trackpad-hint {
            font-size: 0.85rem;
            opacity: 0.85;
            line-height: 1.4;
        }

        .telemetry-readout {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #00ff66;
        }

        .trigger-btn {
            width: 85%;
            height: 75px;
            background: rgba(0, 255, 102, 0.2);
            border: 2px solid #00ff66;
            color: #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>G-BOARD GYRO</h1>
        <div class="status" id="lbl_status">READY FOR PAIRING</div>
    </div>

    <!-- PAIRING SCREEN -->
    <div id="connect_box">
        <input type="text" id="target_peer_id" placeholder="ENTER PEER ID HERE" autocomplete="off" spellcheck="false">
        <button id="btn_pair">CONNECT & ENABLE GYRO</button>
    </div>

    <!-- ACTIVE AIR-MOUSE PAD -->
    <div id="trackpad">
        <div class="trackpad-hint">TILT PHONE TO CONTROL CURSOR</div>
        <div class="telemetry-readout" id="lbl_gyro_data">X: 50% | Y: 50%</div>
        <button class="trigger-btn" id="btn_trigger">CLICK / TRIGGER</button>
    </div>

    <script>
        const peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        let conn = null;
        const lblStatus = document.getElementById('lbl_status');
        const lblGyro = document.getElementById('lbl_gyro_data');
        const connectBox = document.getElementById('connect_box');
        const trackpad = document.getElementById('trackpad');
        const btnPair = document.getElementById('btn_pair');
        const btnTrigger = document.getElementById('btn_trigger');
        const inputPeer = document.getElementById('target_peer_id');

        let posX = 0.5;
        let posY = 0.5;

        btnPair.onclick = async () => {
            let destId = inputPeer.value.trim();
            if (!destId) {
                alert("Please enter the Peer ID from your laptop screen.");
                return;
            }

            if (destId.startsWith("ID:")) {
                destId = destId.replace("ID:", "").trim();
            }

            lblStatus.innerText = "REQUESTING SENSORS & CONNECTING...";
            lblStatus.style.color = "#00f2ff";

            // Universal Mobile Gyro Handshake (iOS Safari, Android Chrome/Edge)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleGyro, true);
                    } else {
                        alert("Motion permission denied by device.");
                    }
                } catch (err) {
                    console.error("DeviceOrientation permission error:", err);
                }
            } else {
                window.addEventListener('deviceorientation', handleGyro, true);
            }

            conn = peer.connect(destId, { reliable: true });

            conn.on('open', () => {
                lblStatus.innerText = "LINKED: GYRO STREAM ONLINE";
                lblStatus.style.color = "#00ff66";
                connectBox.style.display = "none";
                trackpad.classList.add('active');
            });

            conn.on('error', () => {
                lblStatus.innerText = "CONNECTION FAILED";
                lblStatus.style.color = "#ff3b3b";
                alert("Could not connect to Peer ID. Make sure G-BOARD is open on your desktop.");
            });

            conn.on('close', () => {
                lblStatus.innerText = "DISCONNECTED";
                lblStatus.style.color = "#ff3b3b";
                connectBox.style.display = "flex";
                trackpad.classList.remove('active');
            });
        };

        function handleGyro(e) {
            if (!conn || !conn.open) return;

            const gamma = e.gamma || 0;
            const beta = e.beta || 0;

            posX = Math.min(Math.max((gamma + 25) / 50, 0.05), 0.95);
            posY = Math.min(Math.max((beta - 25) / 45, 0.05), 0.95);

            lblGyro.innerText = `X: ${Math.round(posX * 100)}% | Y: ${Math.round(posY * 100)}%`;
            conn.send({ x: posX, y: posY, click: false });
        }

        btnTrigger.onclick = () => {
            if (conn && conn.open) {
                conn.send({ x: posX, y: posY, click: true });
                if (navigator.vibrate) navigator.vibrate(50);
            }
        };
    </script>
</body>
</html>
