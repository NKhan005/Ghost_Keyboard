<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="G-BOARD V8.2 - Full-Screen Molecular Biometric Face Mesh & Spatial OS">
    <title>G-BOARD | MOLECULAR BIOMETRIC OS V8.2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap');
        
        :root { 
            --neon: #00f2ff; 
            --glow: rgba(0, 242, 255, 0.6);
            --alert: #ff3b3b; 
            --success: #00ff66;
            --dim-neon: rgba(0, 242, 255, 0.2); 
            --panel-bg: rgba(3, 15, 20, 0.88);
            --key-text: #00f2ff;
        }

        body.theme-amber {
            --neon: #ffb700;
            --glow: rgba(255, 183, 0, 0.6);
            --dim-neon: rgba(255, 183, 0, 0.2);
            --panel-bg: rgba(20, 15, 3, 0.88);
            --key-text: #ffb700;
        }

        body.theme-crimson {
            --neon: #ff0055;
            --glow: rgba(255, 0, 85, 0.6);
            --dim-neon: rgba(255, 0, 85, 0.2);
            --panel-bg: rgba(20, 3, 10, 0.88);
            --key-text: #ff0055;
        }

        * { 
            box-sizing: border-box; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
            touch-action: none;
        }

        body { 
            margin: 0; 
            background: #020506; 
            color: var(--neon); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh; 
            transition: color 0.2s ease, background 0.2s ease;
        }
        
        #video_input { 
            position: fixed; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); 
            opacity: 0.18; 
            z-index: -1; 
            filter: contrast(125%) brightness(85%); 
        }

        /* FULL-SCREEN BIOMETRIC SECURITY SHIELD */
        #security_shield {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(3, 15, 28, 0.9) 0%, rgba(1, 4, 8, 0.98) 100%);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            z-index: 180;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.2, 0, 0, 1), visibility 0.5s ease;
        }

        #security_shield.unlocked {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* LARGE CIRCULAR BIOMETRIC APERTURE */
        #bio_aperture_wrapper {
            position: relative;
            width: clamp(280px, 42vmin, 380px);
            height: clamp(280px, 42vmin, 380px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bio_camera_viewport {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 2;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85);
            background: #000;
        }

        #bio_live_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: contrast(140%) brightness(110%) hue-rotate(185deg) saturate(160%);
            opacity: 0.85;
        }

        #bio_mesh_canvas {
            position: absolute;
            inset: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
        }

        #bio_orbit_canvas {
            position: absolute;
            width: 140%;
            height: 140%;
            pointer-events: none;
            z-index: 8;
        }

        .bio-ring-outer {
            position: absolute;
            inset: 0;
            border: 2px dashed var(--neon);
            border-radius: 50%;
            animation: rotateClockwise 14s linear infinite;
            box-shadow: 0 0 30px var(--glow), inset 0 0 25px rgba(0, 242, 255, 0.2);
            transition: border-color 0.3s, box-shadow 0.3s;
            z-index: 4;
        }

        .bio-ring-middle {
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-top: 3px solid var(--neon);
            border-bottom: 3px solid var(--neon);
            border-radius: 50%;
            animation: rotateCounterClockwise 9s linear infinite;
            transition: border-color 0.3s;
            z-index: 4;
        }

        #bio_radar_sweep {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 242, 255, 0.4) 0deg, transparent 70deg);
            animation: radarSweep 2.5s linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        #bio_aperture_wrapper.authorized .bio-ring-outer,
        #bio_aperture_wrapper.authorized .bio-ring-middle {
            border-color: var(--success);
            box-shadow: 0 0 50px rgba(0, 255, 102, 0.9), inset 0 0 35px rgba(0, 255, 102, 0.3);
        }

        #bio_aperture_wrapper.authorized #bio_radar_sweep {
            background: conic-gradient(from 0deg, rgba(0, 255, 102, 0.5) 0deg, transparent 70deg);
        }

        @keyframes rotateClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotateCounterClockwise { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes radarSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #bio_status_text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.78rem, 1.8vw, 0.92rem);
            letter-spacing: 3px;
            font-weight: 800;
            color: var(--neon);
            text-align: center;
            margin-top: 32px;
            text-shadow: 0 0 12px var(--glow);
            transition: color 0.3s;
        }

        #bio_progress_bar {
            width: min(320px, 85vw);
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 14px;
            overflow: hidden;
            border: 1px solid var(--dim-neon);
        }

        #bio_progress_fill {
            width: 0%;
            height: 100%;
            background: var(--neon);
            box-shadow: 0 0 12px var(--neon);
            transition: width 0.08s linear, background-color 0.3s;
        }

        /* ROBOTIC RETICLE CURSOR */
        #finger_cursor {
            position: fixed;
            width: 38px;
            height: 38px;
            pointer-events: none;
            z-index: 150;
            display: none;
            transform: translate(-50%, -50%);
            will-change: left, top;
            transition: width 0.1s ease, height 0.1s ease;
        }

        #finger_cursor .reticle-bracket {
            position: absolute;
            inset: 0;
            border: 2px dashed var(--neon);
            border-radius: 50%;
            animation: spinReticle 6s linear infinite;
            transition: border-color 0.15s ease;
        }

        #finger_cursor .reticle-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border: 1px solid var(--neon);
            border-radius: 2px;
            background: rgba(0, 242, 255, 0.25);
            transition: all 0.15s ease;
        }

        #finger_cursor .reticle-core::before,
        #finger_cursor .reticle-core::after {
            content: '';
            position: absolute;
            background: var(--neon);
        }
        #finger_cursor .reticle-core::before { top: -6px; left: 4px; width: 2px; height: 4px; }
        #finger_cursor .reticle-core::after { left: -6px; top: 4px; height: 2px; width: 4px; }

        #finger_cursor.hovering { width: 44px; height: 44px; }
        #finger_cursor.hovering .reticle-bracket {
            border-style: solid;
            border-width: 2px;
            box-shadow: 0 0 14px var(--neon);
        }

        #finger_cursor.locked .reticle-bracket {
            border-color: #00ff66;
            box-shadow: 0 0 20px #00ff66;
            animation-duration: 1.5s;
        }
        #finger_cursor.locked .reticle-core {
            background: #00ff66;
            border-color: #00ff66;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        @keyframes spinReticle { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #main_title { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-family: 'Orbitron', sans-serif; 
            font-size: clamp(1.2rem, 2.5vw, 2rem); 
            font-weight: 900; 
            letter-spacing: clamp(5px, 1.2vw, 12px); 
            text-shadow: 0 0 20px var(--glow); 
            z-index: 100;
            color: #ffffff; 
            text-transform: uppercase;
            margin: 0;
            text-align: center;
            white-space: nowrap;
        }

        #telemetry_box { 
            position: fixed; 
            top: 15px; 
            right: 15px; 
            width: min(270px, 85vw); 
            padding: 8px 12px; 
            background: var(--panel-bg); 
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-right: 4px solid var(--neon);
            border-radius: 6px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: clamp(0.6rem, 1.4vw, 0.72rem); 
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .sys-status-header {
            color: var(--neon); 
            font-weight: bold; 
            margin-bottom: 4px; 
            border-bottom: 1px solid var(--dim-neon); 
            padding-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .fps-display { color: #ffffff; }
        .stat-line { margin-bottom: 2px; display: flex; justify-content: space-between; gap: 6px; }
        .stat-label { opacity: 0.8; }
        .stat-val { font-weight: bold; color: #ffffff; text-align: right; }
        .sec-locked { color: var(--alert); }
        .sec-auth { color: var(--success); }

        #workspace {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding-bottom: 90px;
        }

        #prediction_ribbon {
            display: flex;
            gap: 8px;
            width: min(96vw, 920px);
            justify-content: center;
            z-index: 10;
        }

        .predict-pill {
            flex: 1;
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid var(--dim-neon);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: 'Orbitron', monospace;
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .predict-pill.empty { opacity: 0.45; border-style: dashed; }
        .predict-pill.hover, .predict-pill:hover {
            background: var(--neon);
            color: #000000;
            box-shadow: 0 0 16px var(--neon);
            transform: scale(1.03);
            opacity: 1;
        }

        #keyboard_overlay { 
            display: flex; 
            flex-direction: column; 
            gap: clamp(3px, 0.7vh, 5px); 
            padding: clamp(6px, 1.2vw, 12px); 
            background: rgba(2, 18, 24, 0.65); 
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px); 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            z-index: 10;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.7);
            width: min(96vw, 920px);
        }

        .row { display: flex; justify-content: center; gap: clamp(2px, 0.4vw, 5px); width: 100%; }
        
        .key { 
            flex: 1;
            height: clamp(32px, 5vh, 42px); 
            border: 1px solid rgba(255, 255, 255, 0.18); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            font-weight: 700; 
            background: rgba(255, 255, 255, 0.04); 
            transition: transform 0.06s ease, background 0.06s ease; 
            font-family: 'Orbitron', 'JetBrains Mono', sans-serif; 
            font-size: clamp(0.68rem, 1.3vw, 0.85rem); 
            position: relative; 
            overflow: hidden; 
            color: var(--key-text);
            cursor: pointer;
            min-width: 0;
            padding: 0 2px;
        }

        .key .sub-char { font-size: 0.55em; opacity: 0.6; margin-bottom: -2px; }
        .key.k-backspace { flex: 1.8; background: rgba(255, 59, 59, 0.1); }
        .key.k-tab { flex: 1.3; }
        .key.k-caps { flex: 1.5; }
        .key.k-enter { flex: 1.8; background: rgba(0, 242, 255, 0.12); }
        .key.k-shift { flex: 2.1; }
        .key.k-nav { flex: 0.9; background: rgba(0, 242, 255, 0.1); }
        .key.k-space { flex: 5.5; border-bottom: 3px solid var(--neon); }
        .key.k-fn { flex: 1.3; background: rgba(255, 255, 255, 0.08); font-size: 0.72em; }
        .key.k-active { background: var(--neon); color: #000; }
        .key.k-recording { background: var(--alert) !important; color: #fff !important; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .key.hover, .key:focus { 
            background: var(--neon); 
            color: #000000; 
            box-shadow: 0 0 16px var(--neon); 
            transform: scale(1.05); 
            outline: none;
            z-index: 2;
        }
        
        #clr_fill { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            height: 100%; 
            background: var(--alert); 
            opacity: 0.5; 
            width: 0%; 
            pointer-events: none; 
            transition: width 0.04s linear; 
        }

        #terminal_container {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: min(94vw, 920px);
            background: rgba(2, 10, 14, 0.95);
            border: 1px solid var(--dim-neon);
            border-left: 5px solid var(--neon);
            border-radius: 0 8px 8px 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.85);
            z-index: 90;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        #terminal_log { 
            width: 100%;
            padding: 12px 18px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: clamp(0.92rem, 1.6vw, 1.15rem); 
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 52px; 
            max-height: 200px;
            overflow-y: auto;
            color: #ffffff;
            cursor: text;
            line-height: 1.45;
        }

        #terminal_log::-webkit-scrollbar { width: 5px; }
        #terminal_log::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        #terminal_log::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 4px; }

        .terminal-segment { cursor: pointer; transition: background 0.1s; border-radius: 2px; }
        .terminal-segment:hover { background: rgba(0, 242, 255, 0.2); }

        .terminal-caret {
            display: inline-block;
            width: 9px;
            height: 1.18em;
            background: var(--neon);
            box-shadow: 0 0 10px var(--neon);
            margin: 0 1px;
            vertical-align: middle;
            animation: caretBlink 0.9s infinite;
        }

        @keyframes caretBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

        #sidebar_dock {
            position: fixed;
            top: 0;
            right: -280px;
            width: 270px;
            height: 100vh;
            background: var(--panel-bg); 
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-left: 2px solid var(--neon);
            box-shadow: -8px 0 30px rgba(0,0,0,0.8);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 160;
            transition: right 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        #sidebar_dock.open { right: 0; }

        #btn_sidebar_toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(2, 18, 24, 0.8);
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            z-index: 110;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px var(--dim-neon);
        }

        #btn_sidebar_toggle:hover, #btn_sidebar_toggle:focus {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 18px var(--neon);
            outline: none;
        }

        .dock-header {
            color: var(--neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--dim-neon);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dock-close-btn { background: none; border: none; color: var(--neon); font-size: 1rem; cursor: pointer; }
        .control-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

        .sidebar-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--dim-neon);
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-btn:hover, .sidebar-btn:focus {
            background: var(--neon);
            color: #000000;
            box-shadow: 0 0 15px var(--neon);
            outline: none;
        }

        .mode-state-lbl { color: var(--neon); font-weight: bold; }

        #start_btn { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 18px 40px; 
            font-family: 'Orbitron', sans-serif; 
            background: var(--neon); 
            color: #000000; 
            border: none; 
            cursor: pointer; 
            z-index: 200; 
            font-size: clamp(1rem, 2vw, 1.25rem); 
            font-weight: 900; 
            letter-spacing: 3px;
            border-radius: 8px; 
            box-shadow: 0 0 35px var(--neon); 
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <button id="start_btn" aria-label="Launch G-BOARD Operating System">LAUNCH G-BOARD OS</button>
    <video id="video_input"></video>

    <!-- FULL-SCREEN HOLOGRAPHIC BIOMETRIC APERTURE -->
    <div id="security_shield">
        <div id="bio_aperture_wrapper">
            <canvas id="bio_orbit_canvas"></canvas>
            <div class="bio-ring-outer"></div>
            <div class="bio-ring-middle"></div>
            <div id="bio_radar_sweep"></div>
            
            <div id="bio_camera_viewport">
                <video id="bio_live_video" autoplay muted></video>
            </div>
            
            <canvas id="bio_mesh_canvas"></canvas>
        </div>
        
        <div id="bio_status_text">ALIGN FACE WITHIN APERTURE</div>
        <div id="bio_progress_bar"><div id="bio_progress_fill"></div></div>
    </div>
    
    <!-- ROBOTIC RETICLE CURSOR -->
    <div id="finger_cursor">
        <div class="reticle-bracket"></div>
        <div class="reticle-core"></div>
    </div>
    
    <button id="btn_sidebar_toggle" aria-label="Toggle Functional Configuration Sidebar">⚙ CONFIG</button>
    <h1 id="main_title">G - BOARD</h1>

    <div id="telemetry_box">
        <div class="sys-status-header">
            <span>SYS: ONLINE</span>
            <span id="fps_counter" class="fps-display">60 FPS</span>
        </div>
        <div class="stat-line"><span class="stat-label">SECURITY:</span> <span id="stat_sec" class="stat-val sec-locked">LOCKED</span></div>
        <div class="stat-line"><span class="stat-label">INPUT MODE:</span> <span id="stat_mode" class="stat-val">AUTO DUAL</span></div>
        <div class="stat-line"><span class="stat-label">TIME:</span> <span id="stat_time" class="stat-val">--:--:--</span></div>
        <div class="stat-line"><span class="stat-label">LOCATION:</span> <span id="stat_loc" class="stat-val">LOCATING...</span></div>
        <div class="stat-line"><span class="stat-label">WEATHER:</span> <span id="stat_temp" class="stat-val">--°C</span></div>
        <div class="stat-line"><span class="stat-label">SPEED:</span> <span id="stat_wpm" class="stat-val">0 WPM</span></div>
        <div class="stat-line"><span class="stat-label">CHARS / POS:</span> <span id="stat_chars" class="stat-val">0 (0)</span></div>
    </div>

    <div id="workspace">
        <div id="prediction_ribbon">
            <div class="predict-pill empty" id="pred_0">i</div>
            <div class="predict-pill empty" id="pred_1">the</div>
            <div class="predict-pill empty" id="pred_2">activate</div>
        </div>
        <div id="keyboard_overlay"></div>
    </div>

    <div id="terminal_container">
        <div id="terminal_log"></div>
    </div>

    <div id="sidebar_dock">
        <div class="dock-header">
            <span>COMMAND DOCK</span>
            <button id="btn_dock_close" class="dock-close-btn" aria-label="Close Sidebar">✕</button>
        </div>

        <div class="control-group">
            <button class="sidebar-btn" id="btn_toggle_mode">
                <span>INPUT MODE</span>
                <span id="lbl_mode_state" class="mode-state-lbl">AUTO</span>
            </button>
            
            <button class="sidebar-btn" id="btn_toggle_theme">
                <span>THEME PROFILE</span>
                <span id="lbl_theme_name">CYAN</span>
            </button>

            <button class="sidebar-btn" id="btn_export_doc">
                <span>EXPORT BUFFER</span>
                <span>.TXT</span>
            </button>

            <button class="sidebar-btn" id="btn_clear_buffer">
                <span>CLEAR LOG</span>
                <span>FLUSH</span>
            </button>
        </div>

    <script>

        // REVOLVING MOLECULAR ORBIT PARTICLES
        const molecularParticles = Array.from({ length: 14 }, (_, i) => ({
            angle: (i / 14) * Math.PI * 2,
            radiusX: 0.44,
            radiusY: 0.32,
            tilt: (i % 2 === 0 ? 1 : -1) * 0.4,
            speed: 0.015 + (i % 3) * 0.005,
            size: 2.5 + (i % 3) * 1.5
        }));

        function renderMolecularOrbits() {
            orbitCtx.clearRect(0, 0, bioOrbitCanvas.width, bioOrbitCanvas.height);
            const w = bioOrbitCanvas.width;
            const h = bioOrbitCanvas.height;
            const cx = w / 2;
            const cy = h / 2;

            orbitCtx.strokeStyle = isAuthorized ? "rgba(0, 255, 102, 0.15)" : "rgba(0, 242, 255, 0.15)";
            orbitCtx.lineWidth = 1;

            molecularParticles.forEach(p => {
                p.angle += p.speed;
                const cosT = Math.cos(p.tilt);
                const sinT = Math.sin(p.tilt);

                const unrotX = Math.cos(p.angle) * (w * p.radiusX);
                const unrotY = Math.sin(p.angle) * (h * p.radiusY);

                const x = cx + (unrotX * cosT - unrotY * sinT);
                const y = cy + (unrotX * sinT + unrotY * cosT);

                orbitCtx.fillStyle = isAuthorized ? "#00ff66" : "#00f2ff";
                orbitCtx.shadowBlur = 10;
                orbitCtx.shadowColor = isAuthorized ? "#00ff66" : "#00f2ff";

                orbitCtx.beginPath();
                orbitCtx.arc(x, y, p.size, 0, Math.PI * 2);
                orbitCtx.fill();
                orbitCtx.shadowBlur = 0;
            });

            if (!isAuthorized) {
                requestAnimationFrame(renderMolecularOrbits);
            }

        function playSecurityChime(isSuccess) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                if (isSuccess) {
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                } else {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                }
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        function renderTerminal() {
            terminalLog.innerHTML = "";
            const before = rawBuffer.slice(0, caretPos);
            const after = rawBuffer.slice(caretPos);

            if (before.length > 0) {
                for (let i = 0; i < before.length; i++) {
                    const span = document.createElement('span');
                    span.className = 'terminal-segment';
                    span.innerText = before[i];
                    span.onclick = (e) => { e.stopPropagation(); setCaret(i); };
                    terminalLog.appendChild(span);
                }
            }

            const caretSpan = document.createElement('span');
            caretSpan.className = 'terminal-caret';
            terminalLog.appendChild(caretSpan);

            if (after.length > 0) {
                for (let i = 0; i < after.length; i++) {
                    const idx = caretPos + i;
                    const span = document.createElement('span');
                    span.className = 'terminal-segment';
                    span.innerText = after[i];
                    span.onclick = (e) => { e.stopPropagation(); setCaret(idx + 1); };
                    terminalLog.appendChild(span);
                }
            }

            terminalLog.scrollTop = terminalLog.scrollHeight;
            updateMetrics();
            updatePredictionRibbon();
        }

        function setCaret(pos) {
            caretPos = Math.max(0, Math.min(rawBuffer.length, pos));
            playSpatialClick(0);
            renderTerminal();
        }

        function moveCaret(offset) {
            setCaret(caretPos + offset);
        }

        terminalLog.onclick = () => setCaret(rawBuffer.length);

        function insertTextAtCaret(text) {
            if (!isAuthorized) return;
            if (!startTime) startTime = Date.now();
            rawBuffer = rawBuffer.slice(0, caretPos) + text + rawBuffer.slice(caretPos);
            caretPos += text.length;
            renderTerminal();
        }

        function deleteCharBeforeCaret() {
            if (!isAuthorized) return;
            if (caretPos > 0) {
                rawBuffer = rawBuffer.slice(0, caretPos - 1) + rawBuffer.slice(caretPos);
                caretPos--;
                renderTerminal();
            }
        }

        function getActiveTokenBeforeCaret() {
            const left = rawBuffer.slice(0, caretPos);
            if (!left) return "";
            const tokens = left.split(/\s+/);
            return tokens[tokens.length - 1];
        }

        function formatWordCase(template, targetWord) {
            if (!template) return targetWord.toLowerCase();
            if (template === template.toUpperCase() && template.length > 1) {
                return targetWord.toUpperCase();
            }
            if (template[0] === template[0].toUpperCase()) {
                return targetWord.charAt(0).toUpperCase() + targetWord.slice(1).toLowerCase();
            }
            return targetWord.toLowerCase();
        }

        function updatePredictionRibbon() {
            const rawToken = getActiveTokenBeforeCaret();
            const left = rawBuffer.slice(0, caretPos);
            const endsWithSpace = left.endsWith(" ") || left.endsWith("\n");
            
            let matches = [];

            if (endsWithSpace) {
                const prevTokens = left.trim().split(/\s+/);
                const prev = prevTokens.length > 0 ? prevTokens[prevTokens.length - 1].toUpperCase() : "";
                const bigramMatches = BIGRAMS[prev] || ["system", "online", "command"];
                matches = bigramMatches.map(w => formatWordCase(rawToken, w));
            } else if (rawToken.length > 0) {
                const searchUpper = rawToken.toUpperCase();
                const prefixMatches = DICTIONARY.filter(w => w.startsWith(searchUpper));
                const allMatches = prefixMatches.length < 3 ? prefixMatches.concat(DICTIONARY.filter(w => !prefixMatches.includes(w) && w.includes(searchUpper))) : prefixMatches;
                matches = allMatches.slice(0, 3).map(w => formatWordCase(rawToken, w));
            }

            const defaults = ["i", "the", "activate"].map(w => formatWordCase(rawToken, w));
            for (let i = 0; i < 3; i++) {
                const pill = document.getElementById(`pred_${i}`);
                if (matches[i]) {
                    pill.innerText = matches[i];
                    pill.classList.remove('empty');
                } else {
                    pill.innerText = defaults[i];
                    pill.classList.add('empty');
                }
            }
        }

        function injectPrediction(word) {
            if (!isAuthorized) return;
            playSpatialClick(0);
            const left = rawBuffer.slice(0, caretPos);
            const right = rawBuffer.slice(caretPos);
            const endsWithSpace = left.endsWith(" ") || left.endsWith("\n");
            
            if (endsWithSpace || !left.trim()) {
                rawBuffer = left + word + " " + right;
                caretPos = left.length + word.length + 1;
            } else {
                const lastSpaceIdx = left.lastIndexOf(" ");
                const prefix = lastSpaceIdx !== -1 ? left.slice(0, lastSpaceIdx + 1) : "";
                rawBuffer = prefix + word + " " + right;
                caretPos = prefix.length + word.length + 1;
            }

            renderTerminal();
        }

        for (let i = 0; i < 3; i++) {
            const pill = document.getElementById(`pred_${i}`);
            pill.onclick = () => injectPrediction(pill.innerText);
        }

        function setInputMode(modeIndex) {

        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                insertTextAtCaret(" " + transcript + " ");
            };

            recognition.onend = () => {
                isRecording = false;
                const micKey = document.getElementById('k_MIC');
                if (micKey) micKey.classList.remove('k-recording');
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("Speech Recognition API is not supported in this browser.");
                return;
            }
            const micKey = document.getElementById('k_MIC');
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                if (micKey) micKey.classList.add('k-recording');
            } else {
                recognition.stop();
                isRecording = false;
                if (micKey) micKey.classList.remove('k-recording');
            }
        }

        function playSpatialClick(normalizedX = 0) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(860, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(130, audioCtx.currentTime + 0.035);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);

                if (panner) {
                    panner.pan.setValueAtTime(Math.max(-1, Math.min(1, normalizedX)), audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(panner);
                    panner.connect(audioCtx.destination);
                } else {
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                }

                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch (e) {}
        }

        function speakText(text) {
            if (!synth) return;
            synth.cancel();
            const cleanText = text.trim();
            if (cleanText.length === 0) return;
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.05;
            synth.speak(utterance);
        }

        function initGPSLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        try {
                            const revGeoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                            const geoData = await revGeoRes.json();
                            const locality = geoData.locality || geoData.city || geoData.principalSubdivision || "SURAMPALEM";
                            const country = geoData.countryCode || "IN";
                            document.getElementById('stat_loc').innerText = `${locality.toUpperCase()}, ${country}`;
                        } catch (e) {
                            document.getElementById('stat_loc').innerText = "SURAMPALEM, IN";
                        }

                        try {
                            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                            const weatherData = await weatherRes.json();
                            document.getElementById('stat_temp').innerText = `${weatherData.current_weather.temperature}°C`;
                        } catch (e) {
                            document.getElementById('stat_temp').innerText = "31.5°C";
                        }
                    },
                    () => {
                        document.getElementById('stat_loc').innerText = "SURAMPALEM, IN";
                        document.getElementById('stat_temp').innerText = "31.5°C";
                    },
                    { enableHighAccuracy: false, timeout: 6000, maximumAge: 60000 }
                );
            }
        }

        const qwertyRows = [
            [
                { primary: "`", shift: "~" }, { primary: "1", shift: "!" }, { primary: "2", shift: "@" }, 
                { primary: "3", shift: "#" }, { primary: "4", shift: "$" }, { primary: "5", shift: "%" }, 
                { primary: "6", shift: "^" }, { primary: "7", shift: "&" }, { primary: "8", shift: "*" }, 
                { primary: "9", shift: "(" }, { primary: "0", shift: ")" }, { primary: "-", shift: "_" }, 
                { primary: "=", shift: "+" }, { primary: "BKSP", class: "k-backspace", special: true }
            ],
            [
                { primary: "TAB", class: "k-tab", special: true },
                { primary: "q", shift: "Q" }, { primary: "w", shift: "W" }, { primary: "e", shift: "E" },
                { primary: "r", shift: "R" }, { primary: "t", shift: "T" }, { primary: "y", shift: "Y" },
                { primary: "u", shift: "U" }, { primary: "i", shift: "I" }, { primary: "o", shift: "O" },
                { primary: "p", shift: "P" }, { primary: "[", shift: "{" }, { primary: "]", shift: "}" },
                { primary: "\\", shift: "|" }
            ],
            [
                { primary: "CAPS", class: "k-caps", special: true },
                { primary: "a", shift: "A" }, { primary: "s", shift: "S" }, { primary: "d", shift: "D" },
                { primary: "f", shift: "F" }, { primary: "g", shift: "G" }, { primary: "h", shift: "H" },
                { primary: "j", shift: "J" }, { primary: "k", shift: "K" }, { primary: "l", shift: "L" },
                { primary: ";", shift: ":" }, { primary: "'", shift: "\"" }, 
                { primary: "ENTER", class: "k-enter", special: true }
            ],
            [
                { primary: "SHIFT", class: "k-shift", special: true },
                { primary: "z", shift: "Z" }, { primary: "x", shift: "X" }, { primary: "c", shift: "C" },
                { primary: "v", shift: "V" }, { primary: "b", shift: "B" }, { primary: "n", shift: "N" },
                { primary: "m", shift: "M" }, { primary: ",", shift: "<" }, { primary: ".", shift: ">" },
                { primary: "/", shift: "?" }, { primary: "CLR", class: "k-backspace", special: true }
            ],
            [
                { primary: "◀", class: "k-nav", special: true },
                { primary: "▶", class: "k-nav", special: true },
                { primary: "MIC", class: "k-fn", special: true },
                { primary: "SPEAK", class: "k-fn", special: true },
                { primary: "SPACE", class: "k-space", special: true },
                { primary: "COPY", class: "k-fn", special: true }
            ]
        ];

        function buildKeyboard() {
            keyboard.innerHTML = "";
            qwertyRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                row.forEach(keyObj => {
                    const btn = document.createElement('button');
                    btn.className = `key ${keyObj.class || ''}`;
                    if (keyObj.primary === "CAPS" && isCaps) btn.classList.add('k-active');
                    if (keyObj.primary === "SHIFT" && isShift) btn.classList.add('k-active');

                    let displayChar = keyObj.primary;
                    if (!keyObj.special) {
                        const uppercase = isCaps !== isShift;
                        displayChar = uppercase ? (keyObj.shift && keyObj.primary.length === 1 && keyObj.primary.match(/[a-z]/i) ? keyObj.shift : (isShift ? keyObj.shift : keyObj.primary)) : keyObj.primary;
                    }

                    btn.id = `k_${keyObj.primary}`;
                    btn.dataset.key = keyObj.primary;
                    btn.dataset.shift = keyObj.shift || "";

                    if (keyObj.shift && !keyObj.primary.match(/[a-z]/i)) {
                        btn.innerHTML = `<span class="sub-char">${keyObj.shift}</span><span>${keyObj.primary}</span>`;
                    } else {
                        btn.innerText = displayChar;
                    }

                    if (keyObj.primary === "CLR") btn.innerHTML += '<div id="clr_fill"></div>';

                    btn.onclick = () => {
                        const rect = btn.getBoundingClientRect();
                        const normX = ((rect.left + rect.width / 2) / window.innerWidth) * 2 - 1;
                        handleKeyExecution(btn, normX);
                    };

                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
            cachedInteractables = Array.from(document.querySelectorAll('.key, .predict-pill, .terminal-segment'));
        }

        buildKeyboard();

        document.getElementById('btn_sidebar_toggle').onclick = () => sidebarDock.classList.toggle('open');
        document.getElementById('btn_dock_close').onclick = () => sidebarDock.classList.remove('open');
        document.getElementById('btn_toggle_theme').onclick = cycleTheme;
        document.getElementById('btn_export_doc').onclick = exportBuffer;
        document.getElementById('btn_clear_buffer').onclick = () => {
            rawBuffer = "";
            caretPos = 0;
            startTime = null;
            renderTerminal();
        };

        function updateMetrics() {
            const len = rawBuffer.length;
            document.getElementById('stat_chars').innerText = `${len} (${caretPos})`;

            if (len > 0 && startTime) {
                const minutes = (Date.now() - startTime) / 60000;
                const words = len / 5;
                const wpm = minutes > 0 ? Math.round(words / minutes) : 0;
                document.getElementById('stat_wpm').innerText = `${wpm} WPM`;
            } else {
                document.getElementById('stat_wpm').innerText = `0 WPM`;
            }
        }

        function handleKeyExecution(el, spatialPanX = 0) {
            if (!isAuthorized) return;
            if (el.classList.contains('predict-pill')) {
                injectPrediction(el.innerText);
                return;
            }

            playSpatialClick(spatialPanX);
            const key = el.dataset.key;
            const shiftKey = el.dataset.shift;

            if (key === "CAPS") {
                isCaps = !isCaps;
                buildKeyboard();
            } else if (key === "SHIFT") {
                isShift = !isShift;
                buildKeyboard();
            } else if (key === "◀") {
                moveCaret(-1);
            } else if (key === "▶") {
                moveCaret(1);
            } else if (key === "BKSP") {
                deleteCharBeforeCaret();
            } else if (key === "CLR") {
                rawBuffer = "";
                caretPos = 0;
                startTime = null;
                renderTerminal();
            } else if (key === "TAB") {
                insertTextAtCaret("    ");
            } else if (key === "ENTER") {
                insertTextAtCaret("\n");
            } else if (key === "SPACE") {
                insertTextAtCaret(" ");
            } else if (key === "MIC") {
                toggleSpeechRecognition();
            } else if (key === "SPEAK") {
                speakText(rawBuffer);
            } else if (key === "COPY") {
                copyBuffer();
            } else {
                const uppercase = isCaps !== isShift;
                const charToAdd = uppercase ? (shiftKey && key.match(/[a-z]/i) ? shiftKey : (isShift ? shiftKey : key)) : key;
                insertTextAtCaret(charToAdd);
                
                if (isShift) {
                    isShift = false;
                    buildKeyboard();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isAuthorized) return;
            const currentMode = INPUT_MODES[currentModeIndex];
            if (currentMode === "VISION ONLY") return;

            if (e.key === "ArrowLeft") {
                e.preventDefault();
                moveCaret(-1);
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                moveCaret(1);
            } else if (e.key === "Backspace") {
                deleteCharBeforeCaret();
                playSpatialClick(0);
            } else if (e.key === "Enter") {
                insertTextAtCaret("\n");
                playSpatialClick(0);
            } else if (e.key === "Tab") {
                e.preventDefault();
                insertTextAtCaret("    ");
                playSpatialClick(0);
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                insertTextAtCaret(e.key);
                playSpatialClick(0);
            }
        });

        function drawHolographicMesh(landmarks, box) {
            bioCtx.clearRect(0, 0, bioMeshCanvas.width, bioMeshCanvas.height);
            if (!landmarks || landmarks.length === 0) return;

            const w = bioMeshCanvas.width;
            const h = bioMeshCanvas.height;

            const pts = landmarks.map(pt => ({
                x: (1 - pt.x) * w,
                y: pt.y * h
            }));

            if (pts.length >= 6) {
                const nose = pts[2];
                const leftEye = pts[0];
                const rightEye = pts[1];
                const mouth = pts[3];

                const bridge = { x: (leftEye.x + rightEye.x) / 2, y: (leftEye.y + rightEye.y) / 2 };
                const chin = { x: mouth.x, y: mouth.y + (mouth.y - nose.y) * 0.9 };
                const forehead = { x: bridge.x, y: bridge.y - (nose.y - bridge.y) * 1.5 };

                pts.push(bridge, chin, forehead);
            }

            bioCtx.strokeStyle = isAuthorized ? "rgba(0, 255, 102, 0.45)" : "rgba(0, 242, 255, 0.45)";
            bioCtx.fillStyle = isAuthorized ? "#00ff66" : "#00f2ff";
            bioCtx.lineWidth = 1.2;

            bioCtx.beginPath();
            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const dist = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                    if (dist < w * 0.38) {
                        bioCtx.moveTo(pts[i].x, pts[i].y);
                        bioCtx.lineTo(pts[j].x, pts[j].y);
                    }
                }
            }
            bioCtx.stroke();

            pts.forEach(p => {
                bioCtx.beginPath();
                bioCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                bioCtx.shadowBlur = 8;
                bioCtx.shadowColor = isAuthorized ? "#00ff66" : "#00f2ff";
                bioCtx.fill();
                bioCtx.shadowBlur = 0;
            });
        }

        const faceDetection = new FaceDetection({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
        });
        faceDetection.setOptions({
            model: 'short',
            minDetectionConfidence: 0.5
        });

        faceDetection.onResults((results) => {
            if (results.detections && results.detections.length > 0) {
                lastFaceDetectedTime = Date.now();
                const detection = results.detections[0];
                if (detection.landmarks) {
                    drawHolographicMesh(detection.landmarks, detection.boundingBox);
                }

                if (!isAuthorized) {
                    scanProgress += 2.5;
                    bioProgressFill.style.width = `${Math.min(100, scanProgress)}%`;
                    bioStatusText.innerText = `BIOMETRIC MESH SCAN: ${Math.round(scanProgress)}%`;

                    if (scanProgress >= 100) {
                        isAuthorized = true;
                        bioApertureWrapper.classList.add('authorized');
                        bioStatusText.innerText = "BIOMETRIC MATCH CONFIRMED - ACCESS GRANTED";
                        bioStatusText.style.color = "var(--success)";
                        bioProgressFill.style.backgroundColor = "var(--success)";
                        statSec.innerText = "AUTHORIZED";
                        statSec.className = "stat-val sec-auth";
                        playSecurityChime(true);

                        setTimeout(() => {
                            securityShield.classList.add('unlocked');
                        }, 700);
                    }
                }
            } else {
                bioCtx.clearRect(0, 0, bioMeshCanvas.width, bioMeshCanvas.height);

                if (isAuthorized && (Date.now() - lastFaceDetectedTime > FACE_LOCK_TIMEOUT)) {
                    isAuthorized = false;
                    scanProgress = 0;
                    bioProgressFill.style.width = "0%";
                    bioApertureWrapper.classList.remove('authorized');
                    bioStatusText.innerText = "SECURITY LOCKDOWN - NO USER DETECTED";
                    bioStatusText.style.color = "var(--alert)";
                    statSec.innerText = "LOCKED";
                    statSec.className = "stat-val sec-locked";
                    securityShield.classList.remove('unlocked');
                    renderMolecularOrbits();
                    playSecurityChime(false);
                } else if (!isAuthorized) {
                    scanProgress = Math.max(0, scanProgress - 1.5);
                    bioProgressFill.style.width = `${scanProgress}%`;
                    bioStatusText.innerText = "ALIGN FACE WITHIN APERTURE";
                    bioStatusText.style.color = "var(--neon)";
                }
            }
        });

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ 
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });

        let currentKey = null;
        let hoverStartTime = 0;
        let isPinching = false;
        const TRIGGER_DWELL = 0.65;

        hands.onResults((results) => {
            frameCount++;
            const now = performance.now();
            if (now - lastFrameTime >= 1000) {
                fpsCounter.innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastFrameTime = now;
            }

            if (!isAuthorized) {
                cursor.style.display = 'none';
                return;
            }

            const currentMode = INPUT_MODES[currentModeIndex];
            if (currentMode === "PHYSICAL ONLY") {
                cursor.style.display = 'none';
                return;
            }

            cachedInteractables.forEach(k => k.classList.remove('hover'));
            cursor.style.display = 'none';
            cursor.classList.remove('hovering');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];

                const x = (1 - indexTip.x) * window.innerWidth;
                const y = indexTip.y * window.innerHeight;

                cursor.style.display = 'block';
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;

                const dx = (landmarks[8].x - landmarks[4].x) * window.innerWidth;
                const dy = (landmarks[8].y - landmarks[4].y) * window.innerHeight;
                const pinchDist = Math.hypot(dx, dy);

                const el = document.elementFromPoint(x, y);

                if (el && (el.classList.contains('key') || el.classList.contains('predict-pill') || el.classList.contains('terminal-segment'))) {
                    el.classList.add('hover');
                    cursor.classList.add('hovering');
                    const spatialPanX = (x / window.innerWidth) * 2 - 1;

                    if (pinchDist < 38) {
                        cursor.classList.add('locked');
                        if (!isPinching) {
                            isPinching = true;
                            if (el.classList.contains('terminal-segment')) {
                                el.click();
                            } else {
                                handleKeyExecution(el, spatialPanX);
                            }
                        }
                    } else {
                        isPinching = false;
                        cursor.classList.remove('locked');

                        if (currentKey !== el.id) {
                            currentKey = el.id;
                            hoverStartTime = Date.now();
                        } else {
                            const duration = (Date.now() - hoverStartTime) / 1000;
                            if (el.dataset.key === "CLR") {
                                const fill = document.getElementById('clr_fill');
                                if (fill) fill.style.width = Math.min((duration / 1.1) * 100, 100) + "%";
                                if (duration >= 1.1) {
                                    handleKeyExecution(el, spatialPanX);
                                    hoverStartTime = Date.now();
                                    if (fill) fill.style.width = "0%";
                                }
                            } else if (duration >= TRIGGER_DWELL) {
                                if (el.classList.contains('terminal-segment')) {
                                    el.click();
                                } else {
                                    handleKeyExecution(el, spatialPanX);
                                }
                                hoverStartTime = Date.now();
                            }
                        }
                    }
                } else {
                    cursor.classList.remove('locked');
                    currentKey = null;
                    isPinching = false;
                }
            } else {
                currentKey = null;
                isPinching = false;
            }
        });

        startBtn.onclick = async () => {
            startBtn.style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            initGPSLocation();
            renderTerminal();
            resizeCanvases();
            renderMolecularOrbits();

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: "user",
                    frameRate: { ideal: 30, max: 60 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                bioLiveVideo.srcObject = stream;
                await videoElement.play();
                await bioLiveVideo.play();

                let frameFlip = 0;
                const processFrame = async () => {
                    if (videoElement.readyState >= 2) {
                        frameFlip++;
                        if (frameFlip % 2 === 0) {
                            await faceDetection.send({ image: videoElement });
                        } else {
                            await hands.send({ image: videoElement });
                        }
                    }
                    const now = new Date();
                    document.getElementById('stat_time').innerText = now.toLocaleTimeString([], {hour12:false});
                    requestAnimationFrame(processFrame);
                };
                requestAnimationFrame(processFrame);
            } catch (err) {
                alert("Camera Access Required to Enable Biometric Gate.");
            }
        };
    </script>
</body>
