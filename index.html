<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="G-BOARD V7.2 - Modular Full QWERTY with Collapsible Config Sidebar">
    <title>G-BOARD | MODULAR QWERTY V7.2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { 
            --neon: #00f2ff; 
            --glow: rgba(0, 242, 255, 0.6);
            --alert: #ff3b3b; 
            --dim-neon: rgba(0, 242, 255, 0.2); 
            --panel-bg: rgba(3, 15, 20, 0.85);
            --key-text: #00f2ff;
        }

        body.theme-amber {
            --neon: #ffb700;
            --glow: rgba(255, 183, 0, 0.6);
            --dim-neon: rgba(255, 183, 0, 0.2);
            --panel-bg: rgba(20, 15, 3, 0.85);
            --key-text: #ffb700;
        }

        body.theme-crimson {
            --neon: #ff0055;
            --glow: rgba(255, 0, 85, 0.6);
            --dim-neon: rgba(255, 0, 85, 0.2);
            --panel-bg: rgba(20, 3, 10, 0.85);
            --key-text: #ff0055;
        }

        * { 
            box-sizing: border-box; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
            touch-action: none;
        }

        body { 
            margin: 0; 
            background: #020506; 
            color: var(--neon); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh; 
            transition: color 0.2s ease, background 0.2s ease;
        }
        
        #video_input { 
            position: fixed; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); 
            opacity: 0.2; 
            z-index: -1; 
            filter: contrast(120%) brightness(85%); 
        }

        #finger_cursor {
            position: fixed;
            width: 22px;
            height: 22px;
            border: 2px solid var(--neon);
            border-radius: 50%;
            pointer-events: none;
            z-index: 150;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px var(--neon);
            will-change: left, top;
        }

        /* PERFECTLY CENTERED HEADER TITLE */
        #main_title { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-family: 'Orbitron', sans-serif; 
            font-size: clamp(1.3rem, 2.8vw, 2.2rem); 
            font-weight: 900; 
            letter-spacing: clamp(6px, 1.2vw, 14px); 
            text-shadow: 0 0 20px var(--glow); 
            z-index: 100;
            color: #ffffff; 
            text-transform: uppercase;
            margin: 0;
            text-align: center;
            white-space: nowrap;
        }

        /* DEDICATED INDEPENDENT TELEMETRY PANEL */
        #telemetry_box { 
            position: fixed; 
            top: 15px; 
            right: 15px; 
            width: min(280px, 85vw); 
            padding: 8px 12px; 
            background: var(--panel-bg); 
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-right: 4px solid var(--neon);
            border-radius: 6px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: clamp(0.6rem, 1.4vw, 0.72rem); 
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .sys-status-header {
            color: var(--neon); 
            font-weight: bold; 
            margin-bottom: 4px; 
            border-bottom: 1px solid var(--dim-neon); 
            padding-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .fps-display { color: #ffffff; }
        .stat-line { margin-bottom: 2px; display: flex; justify-content: space-between; gap: 6px; }
        .stat-label { opacity: 0.8; }
        .stat-val { font-weight: bold; color: #ffffff; text-align: right; }

        /* CENTERED KEYBOARD WORKSPACE */
        #workspace {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #keyboard_overlay { 
            display: flex; 
            flex-direction: column; 
            gap: clamp(3px, 0.8vh, 6px); 
            padding: clamp(6px, 1.2vw, 12px); 
            background: rgba(2, 18, 24, 0.65); 
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px); 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            z-index: 10;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.7);
            width: min(96vw, 920px);
        }

        .row { display: flex; justify-content: center; gap: clamp(2px, 0.4vw, 5px); width: 100%; }
        
        .key { 
            flex: 1;
            height: clamp(34px, 5.2vh, 44px); 
            border: 1px solid rgba(255, 255, 255, 0.18); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            font-weight: 700; 
            background: rgba(255, 255, 255, 0.04); 
            transition: transform 0.06s ease, background 0.06s ease; 
            font-family: 'Orbitron', 'JetBrains Mono', sans-serif; 
            font-size: clamp(0.68rem, 1.3vw, 0.85rem); 
            position: relative; 
            overflow: hidden; 
            color: var(--key-text);
            cursor: pointer;
            min-width: 0;
            padding: 0 2px;
        }

        .key .sub-char { font-size: 0.55em; opacity: 0.6; margin-bottom: -2px; }

        .key.k-backspace { flex: 1.8; background: rgba(255, 59, 59, 0.1); }
        .key.k-tab { flex: 1.3; }
        .key.k-caps { flex: 1.5; }
        .key.k-enter { flex: 1.8; background: rgba(0, 242, 255, 0.12); }
        .key.k-shift { flex: 2.1; }
        .key.k-space { flex: 6.5; border-bottom: 3px solid var(--neon); }
        .key.k-fn { flex: 1.4; background: rgba(255, 255, 255, 0.08); font-size: 0.72em; }
        .key.k-active { background: var(--neon); color: #000; }
        .key.k-recording { background: var(--alert) !important; color: #fff !important; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .key.hover, .key:focus { 
            background: var(--neon); 
            color: #000000; 
            box-shadow: 0 0 16px var(--neon); 
            transform: scale(1.05); 
            outline: none;
            z-index: 2;
        }
        
        #clr_fill { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            height: 100%; 
            background: var(--alert); 
            opacity: 0.5; 
            width: 0%; 
            pointer-events: none; 
            transition: width 0.04s linear; 
        }

        /* TERMINAL PANEL */
        #terminal_log { 
            position: fixed; 
            bottom: 12px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: min(94vw, 920px); 
            padding: 10px 18px; 
            background: rgba(2, 10, 14, 0.95); 
            border-left: 5px solid var(--neon); 
            border-radius: 0 6px 6px 0;
            font-family: 'JetBrains Mono', monospace; 
            font-size: clamp(0.95rem, 1.8vw, 1.25rem); 
            white-space: pre-wrap;
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            min-height: 50px; 
            max-height: 85px;
            overflow-y: auto;
            display: flex; 
            align-items: center;
        }

        /* COLLAPSIBLE CYBER SIDEBAR */
        #sidebar_dock {
            position: fixed;
            top: 0;
            right: -280px;
            width: 270px;
            height: 100vh;
            background: var(--panel-bg);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-left: 2px solid var(--neon);
            box-shadow: -8px 0 30px rgba(0,0,0,0.8);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 160;
            transition: right 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        #sidebar_dock.open {
            right: 0;
        }

        /* SIDEBAR TOGGLE BUTTON */
        #btn_sidebar_toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(2, 18, 24, 0.8);
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            z-index: 110;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px var(--dim-neon);
        }

        #btn_sidebar_toggle:hover, #btn_sidebar_toggle:focus {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 18px var(--neon);
            outline: none;
        }

        .dock-header {
            color: var(--neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--dim-neon);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dock-close-btn {
            background: none;
            border: none;
            color: var(--neon);
            font-size: 1rem;
            cursor: pointer;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .sidebar-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--dim-neon);
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-btn:hover, .sidebar-btn:focus {
            background: var(--neon);
            color: #000000;
            box-shadow: 0 0 15px var(--neon);
            outline: none;
        }

        .mode-state-lbl {
            color: var(--neon);
        }

        #start_btn { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 18px 40px; 
            font-family: 'Orbitron', sans-serif; 
            background: var(--neon); 
            color: #000000; 
            border: none; 
            cursor: pointer; 
            z-index: 200; 
            font-size: clamp(1rem, 2vw, 1.25rem); 
            font-weight: 900; 
            letter-spacing: 3px;
            border-radius: 8px; 
            box-shadow: 0 0 35px var(--neon); 
            white-space: nowrap;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            #telemetry_box {
                top: auto;
                bottom: 70px;
                right: 50%;
                transform: translateX(50%);
                width: 96vw;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px 8px;
                padding: 6px 10px;
            }
            .sys-status-header { grid-column: span 2; margin-bottom: 2px; }
            #keyboard_overlay { width: 99vw; padding: 4px; }
            .key { height: 32px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <button id="start_btn" aria-label="Launch G-BOARD Operating System">LAUNCH G-BOARD OS</button>
    <video id="video_input"></video>
    <div id="finger_cursor"></div>
    
    <button id="btn_sidebar_toggle" aria-label="Toggle Functional Configuration Sidebar">⚙ CONFIG</button>
    <h1 id="main_title">G - BOARD</h1>

    <!-- INDEPENDENT TELEMETRY PANEL -->
    <div id="telemetry_box">
        <div class="sys-status-header">
            <span>SYS: ONLINE</span>
            <span id="fps_counter" class="fps-display">60 FPS</span>
        </div>
        <div class="stat-line"><span class="stat-label">INPUT MODE:</span> <span id="stat_mode" class="stat-val">VISION + PINCH</span></div>
        <div class="stat-line"><span class="stat-label">TIME:</span> <span id="stat_time" class="stat-val">--:--:--</span></div>
        <div class="stat-line"><span class="stat-label">LOCATION:</span> <span id="stat_loc" class="stat-val">LOCATING...</span></div>
        <div class="stat-line"><span class="stat-label">WEATHER:</span> <span id="stat_temp" class="stat-val">--°C</span></div>
        <div class="stat-line"><span class="stat-label">SPEED:</span> <span id="stat_wpm" class="stat-val">0 WPM</span></div>
        <div class="stat-line"><span class="stat-label">CHARS:</span> <span id="stat_chars" class="stat-val">0</span></div>
    </div>

    <!-- MAIN KEYBOARD WORKSPACE -->
    <div id="workspace">
        <div id="keyboard_overlay"></div>
    </div>

    <div id="terminal_log"><span id="typed_text">_</span></div>

    <!-- OPTIONAL FUNCTIONAL SIDEBAR (MODES ONLY) -->
    <div id="sidebar_dock">
        <div class="dock-header">
            <span>COMMAND DOCK</span>
            <button id="btn_dock_close" class="dock-close-btn" aria-label="Close Sidebar">✕</button>
        </div>

        <div class="control-group">
            <button class="sidebar-btn" id="btn_toggle_mode">
                <span>INPUT MODE</span>
                <span id="lbl_mode_state" class="mode-state-lbl">AUTO</span>
            </button>
            
            <button class="sidebar-btn" id="btn_toggle_theme">
                <span>THEME PROFILE</span>
                <span id="lbl_theme_name">CYAN</span>
            </button>

            <button class="sidebar-btn" id="btn_export_doc">
                <span>EXPORT BUFFER</span>
                <span>.TXT</span>
            </button>

            <button class="sidebar-btn" id="btn_clear_buffer">
                <span>CLEAR LOG</span>
                <span>FLUSH</span>
            </button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_input');
        videoElement.setAttribute('playsinline', '');
        videoElement.setAttribute('muted', '');

        const typedText = document.getElementById('typed_text');
        const keyboard = document.getElementById('keyboard_overlay');
        const startBtn = document.getElementById('start_btn');
        const cursor = document.getElementById('finger_cursor');
        const fpsCounter = document.getElementById('fps_counter');
        const sidebarDock = document.getElementById('sidebar_dock');
        
        let isShift = false;
        let isCaps = false;
        let audioCtx = null;
        let cachedKeyElements = [];

        let charCount = 0;
        let startTime = null;
        const synth = window.speechSynthesis;
        const themes = ['cyan', 'amber', 'crimson'];
        let currentThemeIndex = 0;

        let lastFrameTime = performance.now();
        let frameCount = 0;

        // SPEECH RECOGNITION (MIC)
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerText += " " + transcript;
                updateMetrics();
            };

            recognition.onend = () => {
                isRecording = false;
                const micKey = document.getElementById('k_MIC');
                if (micKey) micKey.classList.remove('k-recording');
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("Speech Recognition API is not supported in this browser.");
                return;
            }
            const micKey = document.getElementById('k_MIC');
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                if (micKey) micKey.classList.add('k-recording');
            } else {
                recognition.stop();
                isRecording = false;
                if (micKey) micKey.classList.remove('k-recording');
            }
        }

        function playSpatialClick(normalizedX = 0) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(860, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(130, audioCtx.currentTime + 0.035);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);

                if (panner) {
                    panner.pan.setValueAtTime(Math.max(-1, Math.min(1, normalizedX)), audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(panner);
                    panner.connect(audioCtx.destination);
                } else {
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                }

                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch (e) {}
        }

        function speakText(text) {
            if (!synth) return;
            synth.cancel();
            const cleanText = text.replace(/_/g, '').trim();
            if (cleanText.length === 0) return;
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.05;
            synth.speak(utterance);
        }

        function copyBuffer() {
            const raw = typedText.innerText.replace(/_/g, '');
            navigator.clipboard.writeText(raw).then(() => {
                alert("Terminal Buffer Copied to Clipboard!");
            });
        }

        function exportBuffer() {
            const raw = typedText.innerText.replace(/_/g, '');
            const blob = new Blob([raw], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `G-BOARD_LOG_${Date.now()}.txt`;
            link.click();
        }

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const themeName = themes[currentThemeIndex];
            document.body.className = `theme-${themeName}`;
            document.getElementById('lbl_theme_name').innerText = themeName.toUpperCase();
        }

        function initGPSLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        try {
                            const revGeoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                            const geoData = await revGeoRes.json();
                            const locality = geoData.locality || geoData.city || geoData.principalSubdivision || "SURAMPALEM";
                            const country = geoData.countryCode || "IN";
                            document.getElementById('stat_loc').innerText = `${locality.toUpperCase()}, ${country}`;
                        } catch (e) {
                            document.getElementById('stat_loc').innerText = "SURAMPALEM, IN";
                        }

                        try {
                            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                            const weatherData = await weatherRes.json();
                            document.getElementById('stat_temp').innerText = `${weatherData.current_weather.temperature}°C`;
                        } catch (e) {
                            document.getElementById('stat_temp').innerText = "31.5°C";
                        }
                    },
                    () => {
                        document.getElementById('stat_loc').innerText = "SURAMPALEM, IN";
                        document.getElementById('stat_temp').innerText = "31.5°C";
                    },
                    { enableHighAccuracy: false, timeout: 6000, maximumAge: 60000 }
                );
            }
        }

        // FULL QWERTY LAYOUT
        const qwertyRows = [
            [
                { primary: "`", shift: "~" }, { primary: "1", shift: "!" }, { primary: "2", shift: "@" }, 
                { primary: "3", shift: "#" }, { primary: "4", shift: "$" }, { primary: "5", shift: "%" }, 
                { primary: "6", shift: "^" }, { primary: "7", shift: "&" }, { primary: "8", shift: "*" }, 
                { primary: "9", shift: "(" }, { primary: "0", shift: ")" }, { primary: "-", shift: "_" }, 
                { primary: "=", shift: "+" }, { primary: "BKSP", class: "k-backspace", special: true }
            ],
            [
                { primary: "TAB", class: "k-tab", special: true },
                { primary: "q", shift: "Q" }, { primary: "w", shift: "W" }, { primary: "e", shift: "E" },
                { primary: "r", shift: "R" }, { primary: "t", shift: "T" }, { primary: "y", shift: "Y" },
                { primary: "u", shift: "U" }, { primary: "i", shift: "I" }, { primary: "o", shift: "O" },
                { primary: "p", shift: "P" }, { primary: "[", shift: "{" }, { primary: "]", shift: "}" },
                { primary: "\\", shift: "|" }
            ],
            [
                { primary: "CAPS", class: "k-caps", special: true },
                { primary: "a", shift: "A" }, { primary: "s", shift: "S" }, { primary: "d", shift: "D" },
                { primary: "f", shift: "F" }, { primary: "g", shift: "G" }, { primary: "h", shift: "H" },
                { primary: "j", shift: "J" }, { primary: "k", shift: "K" }, { primary: "l", shift: "L" },
                { primary: ";", shift: ":" }, { primary: "'", shift: "\"" }, 
                { primary: "ENTER", class: "k-enter", special: true }
            ],
            [
                { primary: "SHIFT", class: "k-shift", special: true },
                { primary: "z", shift: "Z" }, { primary: "x", shift: "X" }, { primary: "c", shift: "C" },
                { primary: "v", shift: "V" }, { primary: "b", shift: "B" }, { primary: "n", shift: "N" },
                { primary: "m", shift: "M" }, { primary: ",", shift: "<" }, { primary: ".", shift: ">" },
                { primary: "/", shift: "?" }, { primary: "CLR", class: "k-backspace", special: true }
            ],
            [
                { primary: "MIC", class: "k-fn", special: true },
                { primary: "SPEAK", class: "k-fn", special: true },
                { primary: "SPACE", class: "k-space", special: true },
                { primary: "COPY", class: "k-fn", special: true }
            ]
        ];

        function buildKeyboard() {
            keyboard.innerHTML = "";
            qwertyRows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                row.forEach(keyObj => {
                    const btn = document.createElement('button');
                    btn.className = `key ${keyObj.class || ''}`;
                    if (keyObj.primary === "CAPS" && isCaps) btn.classList.add('k-active');
                    if (keyObj.primary === "SHIFT" && isShift) btn.classList.add('k-active');

                    let displayChar = keyObj.primary;
                    if (!keyObj.special) {
                        const uppercase = isCaps !== isShift;
                        displayChar = uppercase ? (keyObj.shift && keyObj.primary.length === 1 && keyObj.primary.match(/[a-z]/i) ? keyObj.shift : (isShift ? keyObj.shift : keyObj.primary)) : keyObj.primary;
                    }

                    btn.id = `k_${keyObj.primary}`;
                    btn.dataset.key = keyObj.primary;
                    btn.dataset.shift = keyObj.shift || "";

                    if (keyObj.shift && !keyObj.primary.match(/[a-z]/i)) {
                        btn.innerHTML = `<span class="sub-char">${keyObj.shift}</span><span>${keyObj.primary}</span>`;
                    } else {
                        btn.innerText = displayChar;
                    }

                    if (keyObj.primary === "CLR") btn.innerHTML += '<div id="clr_fill"></div>';

                    btn.onclick = () => {
                        const rect = btn.getBoundingClientRect();
                        const normX = ((rect.left + rect.width / 2) / window.innerWidth) * 2 - 1;
                        handleKeyExecution(btn, normX);
                    };

                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
            cachedKeyElements = Array.from(document.querySelectorAll('.key'));
        }

        buildKeyboard();

        // SIDEBAR CONTROLS
        document.getElementById('btn_sidebar_toggle').onclick = () => sidebarDock.classList.toggle('open');
        document.getElementById('btn_dock_close').onclick = () => sidebarDock.classList.remove('open');
        document.getElementById('btn_toggle_theme').onclick = cycleTheme;
        document.getElementById('btn_export_doc').onclick = exportBuffer;
        document.getElementById('btn_clear_buffer').onclick = () => {
            typedText.innerText = "_";
            startTime = null;
            updateMetrics();
        };
        document.getElementById('btn_toggle_mode').onclick = () => {
            const lbl = document.getElementById('lbl_mode_state');
            lbl.innerText = lbl.innerText === "AUTO" ? "PHYSICAL" : "AUTO";
        };

        function updateMetrics() {
            const rawText = typedText.innerText.replace(/_/g, '');
            charCount = rawText.length;
            document.getElementById('stat_chars').innerText = charCount;

            if (charCount > 0 && startTime) {
                const minutes = (Date.now() - startTime) / 60000;
                const words = charCount / 5;
                const wpm = minutes > 0 ? Math.round(words / minutes) : 0;
                document.getElementById('stat_wpm').innerText = `${wpm} WPM`;
            } else {
                document.getElementById('stat_wpm').innerText = `0 WPM`;
            }
        }

        function handleKeyExecution(el, spatialPanX = 0) {
            playSpatialClick(spatialPanX);
            const key = el.dataset.key;
            const shiftKey = el.dataset.shift;

            if (key === "CAPS") {
                isCaps = !isCaps;
                buildKeyboard();
            } else if (key === "SHIFT") {
                isShift = !isShift;
                buildKeyboard();
            } else if (key === "BKSP") {
                let t = typedText.innerText;
                if (t !== "_") typedText.innerText = t.slice(0, -1) || "_";
                updateMetrics();
            } else if (key === "CLR") {
                typedText.innerText = "_";
                startTime = null;
                updateMetrics();
            } else if (key === "TAB") {
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerHTML += "&nbsp;&nbsp;&nbsp;&nbsp;";
            } else if (key === "ENTER") {
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerText += "\n";
            } else if (key === "SPACE") {
                if (!startTime) startTime = Date.now();
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerHTML += "&nbsp;";
                updateMetrics();
            } else if (key === "MIC") {
                toggleSpeechRecognition();
            } else if (key === "SPEAK") {
                speakText(typedText.innerText);
            } else if (key === "COPY") {
                copyBuffer();
            } else {
                if (!startTime) startTime = Date.now();
                if (typedText.innerText === "_") typedText.innerText = "";
                const uppercase = isCaps !== isShift;
                const charToAdd = uppercase ? (shiftKey && key.match(/[a-z]/i) ? shiftKey : (isShift ? shiftKey : key)) : key;
                typedText.innerText += charToAdd;
                
                if (isShift) {
                    isShift = false;
                    buildKeyboard();
                }
                updateMetrics();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "Backspace") {
                let t = typedText.innerText;
                if (t !== "_") typedText.innerText = t.slice(0, -1) || "_";
                playSpatialClick(0);
                updateMetrics();
            } else if (e.key === "Enter") {
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerText += "\n";
                playSpatialClick(0);
            } else if (e.key === "Tab") {
                e.preventDefault();
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerHTML += "&nbsp;&nbsp;&nbsp;&nbsp;";
                playSpatialClick(0);
            } else if (e.key.length === 1) {
                if (!startTime) startTime = Date.now();
                if (typedText.innerText === "_") typedText.innerText = "";
                typedText.innerText += e.key;
                playSpatialClick(0);
                updateMetrics();
            }
        });

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ 
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });

        let currentKey = null;
        let hoverStartTime = 0;
        let isPinching = false;
        const TRIGGER_DWELL = 0.65;

        hands.onResults((results) => {
            frameCount++;
            const now = performance.now();
            if (now - lastFrameTime >= 1000) {
                fpsCounter.innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastFrameTime = now;
            }

            cachedKeyElements.forEach(k => k.classList.remove('hover'));
            cursor.style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];

                const x = (1 - indexTip.x) * window.innerWidth;
                const y = indexTip.y * window.innerHeight;

                cursor.style.display = 'block';
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;

                const dx = (landmarks[8].x - landmarks[4].x) * window.innerWidth;
                const dy = (landmarks[8].y - landmarks[4].y) * window.innerHeight;
                const pinchDist = Math.hypot(dx, dy);

                const el = document.elementFromPoint(x, y);

                if (el && el.classList.contains('key')) {
                    el.classList.add('hover');
                    const spatialPanX = (x / window.innerWidth) * 2 - 1;

                    if (pinchDist < 38) {
                        cursor.style.borderColor = "#00ff66";
                        if (!isPinching) {
                            isPinching = true;
                            handleKeyExecution(el, spatialPanX);
                        }
                    } else {
                        isPinching = false;
                        cursor.style.borderColor = "#ffffff";

                        if (currentKey !== el.id) {
                            currentKey = el.id;
                            hoverStartTime = Date.now();
                        } else {
                            const duration = (Date.now() - hoverStartTime) / 1000;
                            if (el.dataset.key === "CLR") {
                                const fill = document.getElementById('clr_fill');
                                if (fill) fill.style.width = Math.min((duration / 1.1) * 100, 100) + "%";
                                if (duration >= 1.1) {
                                    handleKeyExecution(el, spatialPanX);
                                    hoverStartTime = Date.now();
                                    if (fill) fill.style.width = "0%";
                                }
                            } else if (duration >= TRIGGER_DWELL) {
                                handleKeyExecution(el, spatialPanX);
                                hoverStartTime = Date.now();
                            }
                        }
                    }
                } else {
                    cursor.style.borderColor = "var(--neon)";
                    currentKey = null;
                    isPinching = false;
                }
            } else {
                currentKey = null;
                isPinching = false;
            }
        });

        startBtn.onclick = async () => {
            startBtn.style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            initGPSLocation();

            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: "user",
                    frameRate: { ideal: 30, max: 60 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                await videoElement.play();

                const processFrame = async () => {
                    if (videoElement.readyState >= 2) {
                        await hands.send({image: videoElement});
                    }
                    const now = new Date();
                    document.getElementById('stat_time').innerText = now.toLocaleTimeString([], {hour12:false});
                    requestAnimationFrame(processFrame);
                };
                requestAnimationFrame(processFrame);
            } catch (err) {
                alert("Camera Access Required for Spatial Typing.");
            }
        };
    </script>
</body>
</html>
